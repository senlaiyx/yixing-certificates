<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Certificate Verification - Yi Xing Goldsmith</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cert-card">
    <div class="logo-circle">E</div>
    <h2>CERTIFICATE</h2>
    
    <div id="loading">Verifying certificate...</div>
    <div id="cert-details" style="display:none;">
      <div class="row"><span>Certificate Number</span> : <b id="lbl-cert"></b></div>
      <div class="row"><span>Weight</span> : <b id="lbl-weight"></b></div>
      <div class="row"><span>Width</span> : <b id="lbl-width"></b></div>
      <div class="row"><span>Length</span> : <b id="lbl-length"></b></div>
      <div class="row"><span>Thickness</span> : <b id="lbl-thickness"></b></div>
      <div class="row"><span>Fineness</span> : <b id="lbl-fineness"></b></div>
      <div class="row"><span>Certificate Assayer</span> : <b id="lbl-assayer"></b></div>
      
      <div class="badge-box">
        <div class="ea-badge">ea</div>
        <span>Emas Assayer</span>
      </div>
    </div>
    
    <div id="error-msg" style="display:none; color: red; text-align: center;">
      <h3>❌ Invalid Certificate</h3>
      <p>This certificate number could not be verified in our registry.</p>
    </div>
  </div>

  <script type="module">
    import { db } from './firebase-config.js';
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    async function verifyCertificate() {
      const urlParams = new URLSearchParams(window.location.search);
      const certId = urlParams.get('id');

      if (!certId) {
        showError();
        return;
      }

      try {
        // 1. Fetch certificate record
        const certSnap = await getDoc(doc(db, "certificates", certId));
        if (!certSnap.exists()) {
          showError();
          return;
        }

        const certData = certSnap.data();

        // 2. Fetch the corresponding template blueprint
        const templateSnap = await getDoc(doc(db, "templates", certData.templateId));
        if (!templateSnap.exists()) {
          showError();
          return;
        }

        const templateData = templateSnap.data();

        // 3. Populate data into the visual template card
        document.getElementById('lbl-cert').innerText = certData.certNumber;
        document.getElementById('lbl-weight').innerText = templateData.weight;
        document.getElementById('lbl-width').innerText = templateData.width;
        document.getElementById('lbl-length').innerText = templateData.length;
        document.getElementById('lbl-thickness').innerText = templateData.thickness;
        document.getElementById('lbl-fineness').innerText = templateData.fineness;
        document.getElementById('lbl-assayer').innerText = templateData.assayer;

        document.getElementById('loading').style.display = 'none';
        document.getElementById('cert-details').style.display = 'block';

      } catch (err) {
        console.error(err);
        showError();
      }
    }

    function showError() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-msg').style.display = 'block';
    }

    verifyCertificate();
  </script>
</body>
</html>
